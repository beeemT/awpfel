name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check install scripts
        run: shellcheck install.sh install-remote.sh scripts/build-archives.sh
      - name: Check zsh plugin syntax
        run: |
          for f in plugin/awpfel.zsh plugin/awpfel-utils.zsh plugin/awpfel-render.zsh plugin/awpfel-interact.zsh plugin/awpfel-communicate.zsh; do zsh -n "$f"; done
      - name: Run zsh smoke tests
        run: zsh tests/zsh_smoke_test.zsh
