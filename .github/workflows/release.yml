name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Reject prerelease and non-semver tags
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be vMAJOR.MINOR.PATCH with no suffix"
            exit 1
          fi

  build:
    needs: check-tag
    runs-on: macos-14
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build archives and formula
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          sh scripts/build-archives.sh "$VERSION"
          python3 scripts/generate-formula.py "$VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awpfel-package
          path: dist/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check release secret before publication
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required before publication"
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: awpfel-package
          path: dist

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --repo "$GH_REPO"
          fi

      - name: Update personal Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TAP_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone "https://github.com/beeemT/homebrew-tap.git" tap
          cp "dist/awpfel.rb" tap/Formula/awpfel.rb
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/awpfel.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap commit -m "awpfel $RELEASE_TAG"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C tap push
