[package]
name = "awpfel"
version = "0.3.1"
edition = "2024"
description = "On-device AI ghost text for zsh, backed by a managed local Apfel."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"
libc = "0.2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
vt100 = "0.18.1"
